name: Build patched authentik

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream tag (e.g. 2024.12.1). Empty = auto-detect"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_build: ${{ steps.should-build.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve upstream version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            LATEST=$(curl -sL https://api.github.com/repos/goauthentik/authentik/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
            echo "version=${LATEST}" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if already built
        id: should-build
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if docker manifest inspect ghcr.io/${{ github.repository }}:${VERSION} > /dev/null 2>&1; then
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Image for ${VERSION} already exists, skipping"
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Will build ${VERSION}"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout upstream at version/${{ needs.detect.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: goauthentik/authentik
          ref: version/${{ needs.detect.outputs.version }}
          path: upstream

      - name: Checkout patch files
        uses: actions/checkout@v4
        with:
          path: patches
          sparse-checkout: |
            user_settings.py
            locale/zh-Hans
            web/xliff/zh-Hans.xlf
            ENTERPRISE_PATCH_README.md

      - name: Apply patches
        run: |
          VERSION="${{ needs.detect.outputs.version }}"
          cp -v patches/locale/zh-Hans/LC_MESSAGES/django.po \
            upstream/locale/zh-Hans/LC_MESSAGES/django.po
          cp -v patches/locale/zh-Hans/LC_MESSAGES/django.mo \
            upstream/locale/zh-Hans/LC_MESSAGES/django.mo
          cp -v patches/web/xliff/zh-Hans.xlf \
            upstream/web/xliff/zh-Hans.xlf
          mkdir -p upstream/authentik/enterprise
          cp -v patches/user_settings.py \
            upstream/authentik/enterprise/patch_license.py
          mkdir -p upstream/.patches
          cp -v patches/ENTERPRISE_PATCH_README.md upstream/.patches/
          echo "version=${VERSION}" > upstream/.patches/version.txt
          echo "commit=${{ github.sha }}" >> upstream/.patches/version.txt

      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          if [ -f upstream/Dockerfile ]; then
            echo "file=upstream/Dockerfile" >> "$GITHUB_OUTPUT"
          elif [ -f upstream/lifecycle/container/Dockerfile ]; then
            echo "file=upstream/lifecycle/container/Dockerfile" >> "$GITHUB_OUTPUT"
          else
            echo "No supported upstream Dockerfile found" >&2
            find upstream -name Dockerfile -print >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: ${{ steps.dockerfile.outputs.file }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
            GIT_BUILD_HASH=${{ github.sha }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.detect.outputs.version }}
          name: authentik patched ${{ needs.detect.outputs.version }}
          body: |
            ## 基于 upstream [${{ needs.detect.outputs.version }}](https://github.com/goauthentik/authentik/releases/tag/version/${{ needs.detect.outputs.version }}) 构建

            ### 变更
            - 企业 License 解锁（Enterprise 功能全开）
            - 简体中文翻译补全（后端 69 条 + 前端 649 条）

            ### 使用
            ```yaml
            services:
              server:
                image: ghcr.io/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ```

            ### 拉取命令
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ needs.detect.outputs.version }}
            ```

            ---

            [部署文档](https://github.com/${{ github.repository }}/blob/main/ENTERPRISE_PATCH_README.md)
          target_commitish: ${{ github.sha }}
          generate_release_notes: false
          make_latest: true
