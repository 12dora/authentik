name: Build patched authentik image

on:
  schedule:
    # Check for new upstream releases daily
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream version (e.g. 2024.12.1). Leave empty for auto-detect"
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      should_build: ${{ steps.should-build.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine upstream version
        id: get-version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            LATEST=$(curl -s https://api.github.com/repos/goauthentik/authentik/releases/latest \
              | jq -r '.tag_name' | sed 's/^v//')
            echo "version=${LATEST}" >> $GITHUB_OUTPUT
          fi

      - name: Check if we already built this version
        id: should-build
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if docker manifest inspect ghcr.io/${{ github.repository }}:${VERSION} > /dev/null 2>&1; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "Image for version ${VERSION} already exists, skipping"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
            echo "Will build image for version ${VERSION}"
          fi

  build:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout upstream source at version
        uses: actions/checkout@v4
        with:
          repository: goauthentik/authentik
          ref: version/${{ needs.detect.outputs.version }}
          path: upstream

      - name: Checkout patch files from our fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref_name }}
          path: patches
          sparse-checkout: |
            user_settings.py
            locale/zh-Hans
            web/xliff/zh-Hans.xlf
            ENTERPRISE_PATCH_README.md

      - name: Apply patches over upstream source
        run: |
          VERSION="${{ needs.detect.outputs.version }}"

          # Backend translations
          cp -v patches/locale/zh-Hans/LC_MESSAGES/django.po \
            upstream/locale/zh-Hans/LC_MESSAGES/django.po
          cp -v patches/locale/zh-Hans/LC_MESSAGES/django.mo \
            upstream/locale/zh-Hans/LC_MESSAGES/django.mo

          # Frontend translations (rebuilt at Docker build time)
          cp -v patches/web/xliff/zh-Hans.xlf \
            upstream/web/xliff/zh-Hans.xlf

          # Enterprise license patch (placed in container for optional mount)
          cp -v patches/user_settings.py \
            upstream/authentik/authentik/enterprise/patch_license.py

          # Record patch info
          mkdir -p upstream/.patches
          cp -v patches/ENTERPRISE_PATCH_README.md upstream/.patches/
          echo "Upstream version: ${VERSION}" > upstream/.patches/version.txt
          echo "Built at: $(date -u)" >> upstream/.patches/version.txt
          echo "Commit: ${{ github.sha }}" >> upstream/.patches/version.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push patched image
        uses: docker/build-push-action@v6
        with:
          context: upstream
          file: upstream/lifecycle/container/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ needs.detect.outputs.version }}
            GIT_BUILD_HASH=${{ github.sha }}

  notify:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print result
        run: |
          STATUS="${{ needs.build.result }}"
          VERSION="${{ needs.detect.outputs.version }}"
          if [ "${STATUS}" = "success" ]; then
            echo "::notice::Patched image built: ghcr.io/${{ github.repository }}:${VERSION}"
          else
            echo "::warning::Patched image build ${STATUS} for version ${VERSION}"
          fi
